[project]
name = "racestrategies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astral>=3.2",
    "folium>=0.20.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.5.0",
    "pyqt5>=5.15.11",
    "pyqtwebengine>=5.15.7",
    "pytest>=9.1.0",
    "pytz>=2026.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.52.2",
    "streamlit-folium>=0.26.1",
    "tzlocal>=5.4.3",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 200
